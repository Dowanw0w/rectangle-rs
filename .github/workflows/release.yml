name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Cross compilation happens here: one arm64 macOS runner produces both
      # Apple Silicon and Intel builds, and the Windows runner builds the MSVC
      # binary natively.
      - name: Build
        run: cargo build -p rectangle-rs --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "dist/rectangle-rs-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rectangle-rs.exe" $dir
          Copy-Item README.md, LICENSE $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "rectangle-rs-${{ matrix.name }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/bundle-macos.sh
          ./scripts/bundle-macos.sh "${{ matrix.target }}" release
          ditto -c -k --sequesterRsrc --keepParent "target/rectangle-rs.app" "rectangle-rs-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: rectangle-rs-${{ matrix.name }}
          path: rectangle-rs-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          draft: false
          generate_release_notes: true
