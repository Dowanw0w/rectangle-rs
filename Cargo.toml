[workspace]
resolver = "3"
members = ["crates/core", "crates/platform", "crates/app"]

# On platforms GPUI cannot build on (Linux CI), a bare `cargo build`/`cargo test`
# still exercises the pure logic crates instead of failing on GUI dependencies.
default-members = ["crates/core", "crates/platform"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Dowanw0w/rectangle-rs"
homepage = "https://github.com/Dowanw0w/rectangle-rs"

[workspace.dependencies]
rectangle-core = { path = "crates/core" }
rectangle-platform = { path = "crates/platform" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
